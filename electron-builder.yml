# Packages Dumbledore.app (`npm run package`, which builds the Swift helper first) with the helper
# embedded at Contents/Library/LoginItems/Dumbledore Helper.app (packagedHelperAppPath in
# src/engine/helper/launcher.ts). Dumbledore starts it as a child process, so it runs under
# Dumbledore.app's own Accessibility and Screen Recording grants (src/main/real/helper-launch.ts).
appId: org.stuhi.dumbledore
productName: Dumbledore
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
electronDist: node_modules/electron/dist
npmRebuild: false
asarUnpack:
  - '**/*.node'
extraFiles:
  - from: native/helper/build/Dumbledore Helper.app
    to: Library/LoginItems/Dumbledore Helper.app
# No other process may borrow Dumbledore's macOS grants by running it as plain Node or with a
# debugger attached.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
mac:
  target: dir
  category: public.app-category.education
  # Electron's own helper processes must not share the Swift helper's bundle id
  # (org.stuhi.dumbledore.helper), or macOS mixes up their permissions and launches.
  helperBundleId: org.stuhi.dumbledore.electron-helper
  # Local ad-hoc signing (scripts sign after packaging); no Developer ID yet.
  identity: null
  extendInfo:
    LSUIElement: true
